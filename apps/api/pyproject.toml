[project]
name = "shipping-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "celery[redis]>=5.6,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipping_ai"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
